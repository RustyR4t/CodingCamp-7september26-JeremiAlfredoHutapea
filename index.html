<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="dashboard">

        <!-- =========================
             GREETING
        ========================== -->
        <section class="top-bar">

            <div>
                <p class="small-title">MY LIFE DASHBOARD</p>

                <h1 id="greeting">
                    Good morning!
                </h1>

                <p id="date-time">
                    Loading...
                </p>
            </div>


            <!-- CUSTOM NAME -->
            <div class="name-area">

                <label for="name-input">
                    Your name
                </label>

                <div class="name-row">

                    <input
                        id="name-input"
                        type="text"
                        placeholder="Enter your name"
                    >

                    <button id="save-name">
                        Save
                    </button>

                </div>


                <!-- DARK MODE -->
                <button
                    id="theme-toggle"
                    class="secondary-button"
                >
                    🌙 Dark Mode
                </button>

            </div>

        </section>


        <!-- =========================
             MAIN CONTENT
        ========================== -->
        <section class="grid">


            <!-- =========================
                 TO-DO LIST
            ========================== -->
            <div class="card todo-card">

                <div class="card-header">

                    <div>
                        <p class="small-title">
                            TODAY
                        </p>

                        <h2>
                            To-Do List
                        </h2>
                    </div>


                    <span id="task-count">
                        0 tasks
                    </span>

                </div>


                <!-- INPUT TASK -->
                <form
                    id="task-form"
                    class="task-form"
                >

                    <input
                        id="task-input"
                        type="text"
                        placeholder="What do you need to do?"
                        autocomplete="off"
                    >

                    <button type="submit">
                        Add
                    </button>

                </form>


                <p
                    id="task-message"
                    class="message"
                ></p>


                <!-- TEMPAT TASK -->
                <ul id="task-list"></ul>

            </div>



            <!-- =========================
                 FOCUS TIMER
            ========================== -->
            <div class="card timer-card">

                <p class="small-title">
                    FOCUS
                </p>

                <h2>
                    Focus Timer
                </h2>


                <div
                    id="timer-display"
                    class="timer-display"
                >
                    25:00
                </div>


                <p id="timer-status">
                    Ready to focus
                </p>


                <div class="timer-buttons">

                    <button id="start-timer">
                        Start
                    </button>

                    <button
                        id="stop-timer"
                        class="secondary-button"
                    >
                        Stop
                    </button>

                    <button
                        id="reset-timer"
                        class="secondary-button"
                    >
                        Reset
                    </button>

                </div>

            </div>



            <!-- =========================
                 QUICK LINKS
            ========================== -->
            <div class="card links-card">

                <div class="card-header">

                    <div>

                        <p class="small-title">
                            SHORTCUTS
                        </p>

                        <h2>
                            Quick Links
                        </h2>

                    </div>

                </div>


                <!-- INPUT LINK -->
                <form
                    id="link-form"
                    class="link-form"
                >

                    <input
                        id="link-name"
                        type="text"
                        placeholder="Website name"
                    >

                    <input
                        id="link-url"
                        type="url"
                        placeholder="https://example.com"
                    >

                    <button type="submit">
                        Add Link
                    </button>

                </form>


                <!-- TEMPAT LINK -->
                <div
                    id="link-list"
                    class="link-list"
                ></div>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</body>
</html>
